{% assign lang = page.lang | default: "en" %}
{% assign t = site.data[lang] %}
{% capture lang_prefix %}{% if lang == 'it' %}/it{% endif %}{% endcapture %}

<div class="idea-flow">
    <section class="idea-intro" aria-labelledby="idea-intro-title">
        <h2 id="idea-intro-title"><i class="fa-regular fa-lightbulb"></i> {{ t.idea_title }}</h2>
        <p class="idea-description">{{ t.idea_desc }}</p>

        <aside class="idea-reward">
            <span class="idea-reward-label">{{ t.idea_reward_label }}</span>
            <p>{{ t.idea_reward_text }}</p>
        </aside>
    </section>

    <section id="share-idea" aria-labelledby="idea-form-title">
        <h2 id="idea-form-title">{{ t.idea_form_title }}</h2>

        <form id="idea-form" onsubmit="sendIdeaEmail(event)">
            <div class="form-group">
                <input type="text" id="idea-name" placeholder="{{ t.placeholder_name }}" class="form-input">
            </div>
            <div class="form-group">
                <textarea id="idea-text" placeholder="{{ t.placeholder_idea }}" rows="5" class="form-input"></textarea>
            </div>

            <div class="checkbox-group">
                <input type="checkbox" id="idea-terms">
                <label for="idea-terms">
                    {{ t.agree_to }}
                    <a href="{{ site.baseurl }}{{ lang_prefix }}/terms-of-use.html#user-feedback" target="_blank">
                        {{ t.idea_terms }}
                    </a>
                </label>
            </div>

            <button type="submit" class="btn-main">
                {{ t.btn_continue }} <i class="fa-solid fa-paper-plane"></i>
            </button>

            <div id="ideaErrorMsg" class="error-alert">
                <i class="fa-solid fa-triangle-exclamation"></i>
                <span id="ideaErrorText"></span>
            </div>
        </form>
    </section>
</div>

<script>
    function sendIdeaEmail(event) {
        event.preventDefault();

        const name = document.getElementById('idea-name').value.trim();
        const idea = document.getElementById('idea-text').value.trim();
        const termsCheckbox = document.getElementById('idea-terms');
        const errorMsg = document.getElementById('ideaErrorMsg');
        const errorText = document.getElementById('ideaErrorText');

        if (idea === "") {
            errorText.innerHTML = "{{ t.error_empty_idea }}";
            errorMsg.style.display = 'flex';
            return;
        }

        if (!termsCheckbox.checked) {
            errorText.innerHTML = "{{ t.error_idea_terms }}";
            errorMsg.style.display = 'flex';
            return;
        }

        errorMsg.style.display = 'none';

        let bodyText = "{{ t.email_greeting }} {{ site.author_name }},\n\n{{ t.email_idea_intro }}\n" + idea;

        if (name) {
            bodyText += "\n\n{{ t.email_salutation }}\n" + name;
        } else {
            bodyText += "\n\n{{ t.email_thank_you }}";
        }

        const subject = encodeURIComponent("{{ t.email_idea_subject }}");
        const body = encodeURIComponent(bodyText);
        const devEmail = "{{ site.email }}";

        window.location.href = `mailto:${devEmail}?subject=${subject}&body=${body}`;
    }
</script>
