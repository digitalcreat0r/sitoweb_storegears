# Value pillars
value_title: "Running your Shopify store should feel lighter"
value_desc: "Every app is designed to save time, follow Shopify's recommended security practices, so you can focus on sales, not on software."
value_pillars:
  - icon: "fa-solid fa-clock"
    keyword: "Automation"
    text: "Stop losing hours to repetitive tasks. Let the apps do the work for you. Reminders, reports, and syncs run on their own, so you can focus on what matters most."
    badge: "Save time"
  - icon: "fa-solid fa-bolt"
    keyword: "Simplicity"
    text: "Every app is designed to be minimal and intuitive. Quick setup, a clean interface, and no learning curve, so you can get back to selling."
    badge: "Easy to run"
  - icon: "fa-solid fa-shield-halved"
    keyword: "Security"
    text: "Shopify's recommended practices, reliable hosting, secure login, and regular updates. Built to keep your store data protected and your apps running smoothly."
    badge: "Trust first"

