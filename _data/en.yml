# Value pillars
value_title: "Built for Shopify\u00a0merchants who want results, not extra work"
value_desc: "Every app is designed to save time, protect your store, and stay simple to use, so you can focus on sales, not on software."
value_pillars:
  - icon: "fa-solid fa-clock"
    keyword: "Automation"
    text: "Cut the repetitive work: reminders, reports, syncs, and busywork that steals hours from your day. More time for customers, products, and profit."
    badge: "Save time"
  - icon: "fa-solid fa-bolt"
    keyword: "Simplicity"
    text: "Clear setup, no clutter, no steep learning curve. You install, configure, and get back to selling, convenience that shows up every day."
    badge: "Easy to run"
  - icon: "fa-solid fa-sliders"
    keyword: "Customization"
    text: "Tailored apps for merchants who expect more than a generic tool. Workflows, rules, and interfaces shaped around how your store actually runs."
    badge: "Made for you"
  - icon: "fa-solid fa-shield-halved"
    keyword: "Security"
    text: "Professional hosting, Shopify APIs, solid authentication, and ongoing updates. Stack and infrastructure chosen to keep store data protected and operations stable."
    badge: "Trust first"
