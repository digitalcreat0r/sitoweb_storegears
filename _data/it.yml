# Pilastri di valore
value_title: "Pensato per chi gestisce uno\u00a0store\u00a0Shopify e vuole risultati, non lavoro in più"
value_desc: "Ogni app è pensata per farti risparmiare tempo, proteggere il negozio e restare semplice da usare, così resti sulle vendite, non sul software."
value_pillars:
  - icon: "fa-solid fa-clock"
    keyword: "Automazione"
    text: "Via i lavori noiosi: reminder, report, sincronizzazioni e operazioni ripetitive che rubano ore alla giornata. Più tempo per clienti, prodotti e profitto."
    badge: "Risparmi tempo"
  - icon: "fa-solid fa-bolt"
    keyword: "Semplicità"
    text: "Configurazione chiara, zero complicazioni, nessun corso da fare. Installi, imposti e torni a vendere: comodità che senti ogni giorno."
    badge: "Facile da usare"
  - icon: "fa-solid fa-sliders"
    keyword: "Personalizzazione"
    text: "App su misura per i venditori più esigenti, non template generici. Flussi, regole e interfacce adattati a come lavori davvero nel tuo store."
    badge: "Su misura"
  - icon: "fa-solid fa-shield-halved"
    keyword: "Sicurezza"
    text: "Hosting professionale, API Shopify, autenticazione solida e aggiornamenti continui. Tecnologie e infrastruttura scelte per proteggere i dati del negozio e mantenere tutto stabile."
    badge: "Massima fiducia"
