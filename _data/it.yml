# Pilastri di valore
value_title: "Gestire il tuo\u00a0store\u00a0Shopify dovrebbe essere più leggero"
value_desc: "Ogni app è progettata per farti risparmiare tempo, seguendo le pratiche di sicurezza consigliate da Shopify, così puoi concentrarti sulle vendite, non sul software."
value_pillars:
  - icon: "fa-solid fa-clock"
    keyword: "Automazione"
    text: "Basta perdere ore in attività ripetitive. Lascia che siano le app a lavorare al posto tuo. Promemoria, report e sincronizzazioni vanno avanti da soli, così puoi dedicarti a ciò che conta di più."
    badge: "Risparmi tempo"
  - icon: "fa-solid fa-bolt"
    keyword: "Semplicità"
    text: "Ogni app è progettata per essere minimale e intuitiva. Configurazione rapida, interfaccia pulita e nessuna curva di apprendimento, così torni subito a vendere."
    badge: "Facile da usare"
  - icon: "fa-solid fa-shield-halved"
    keyword: "Sicurezza"
    text: "Linee guida consigliate da Shopify, hosting affidabile, accesso sicuro e aggiornamenti regolari. Pensato per proteggere i dati del tuo negozio e far funzionare le app senza intoppi."
    badge: "Massima fiducia"

