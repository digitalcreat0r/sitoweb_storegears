---
layout: default
title: Shopify App Development
---
{% assign lang = page.lang | default: "en" %}
{% assign t = site.data[lang] %}

<header>
    {% if t.hero_badge %}
    <div>
        <span class="dev-badge">
            <span class="badge-dot"></span>
            {{ t.hero_badge }}
        </span>
    </div>
    {% endif %}
    <div class="profile-img">
        <img src="{{ '/assets/images/fp.jpg' | relative_url }}" alt="Profile Photo">
    </div>
    <h1>{{ t.greeting }}</h1>
    <p class="about-text">
        {{ t.about_subtitle }}
    </p>
</header>
